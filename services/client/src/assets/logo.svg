<svg id="standalone-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="auto" style="max-width: 400px;">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1"/>
                </linearGradient>
                <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#e6e6e6;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#808080;stop-opacity:1"/>
                </linearGradient>
                <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#b3b3b3;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#4d4d4d;stop-opacity:1"/>
                </linearGradient>
                <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#808080;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#262626;stop-opacity:1"/>
                </linearGradient>
            </defs>

            <!-- Centered icon only -->
            <g transform="translate(230, 120)">
                <!-- A's Crossbar -->
                <path d="M-150, -20 L-80, -20 L-80, 20 L-150, 20 Z" fill="url(#grad3)"/>
                <!-- A's Slanted Left Leg -->
                <path d="M-80, -90 L-130, -90 L-210, 90 L-160, 90 Z" fill="url(#grad2)"/>
                <!-- Central Pillar -->
                <path d="M-80, -90 L-30, -90 L-30, 90 L-80, 90 Z" fill="url(#grad1)"/>
                <!-- E's Layers -->
                <path d="M-30, -80 L 50, -80 L 80, -40 L-30, -40 Z" fill="url(#grad2)"/>
                <path d="M-30, -20 L 70, -20 L 100, 20 L-30, 20 Z" fill="url(#grad3)"/>
                <path d="M-30, 40 L 90, 40 L 120, 80 L-30, 80 Z" fill="url(#grad4)"/>
                
                <!-- Inner circuit/connection accents -->
                <line x1="-30" y1="-60" x2="20" y2="-60" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
                <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
                <line x1="-30" y1="60" x2="40" y2="60" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" opacity="0.3"/>
                <line x1="-125" y1="0" x2="-80" y2="0" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
            </g>
        </svg>